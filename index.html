<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>拉片截图工具</title>
    <script src="./lib/CSInterface.js"></script>
    <style>
        * { margin:0;padding:0;box-sizing:border-box; }
        body { font-family:-apple-system,"Segoe UI",sans-serif; background:#1e1e1e; color:#ccc; padding:16px; }
        .title { font-size:15px;font-weight:600;color:#fff;margin-bottom:16px;padding-bottom:10px;border-bottom:1px solid #333; }
        .row { display:flex;align-items:center;gap:10px;margin-bottom:14px; }
        .row label { font-size:13px;white-space:nowrap;color:#aaa; }
        .row input { width:48px;padding:6px 8px;background:#2d2d2d;border:1px solid #444;border-radius:4px;color:#fff;font-size:13px;text-align:center; }
        .hint { font-size:11px;color:#666;margin-top:-8px;margin-bottom:14px; }
        button { display:block;width:100%;padding:10px 14px;margin-bottom:8px;border:none;border-radius:5px;font-size:13px;font-weight:500;cursor:pointer; }
        button:active { opacity:.85; }
        .btn1 { background:#3a5fcd;color:#fff; }
        .btn1:hover { background:#4a6fdd; }
        .btn1:disabled { background:#2a3a5a;color:#666;cursor:not-allowed; }
        .btn2 { background:#3a7a3a;color:#fff; }
        .btn2:hover { background:#4a8a4a; }
        .btn2:disabled { background:#2a4a2a;color:#666;cursor:not-allowed; }
        .divider { height:1px;background:#333;margin:14px 0; }
        .status { font-size:12px;color:#888;min-height:20px;margin-bottom:4px; }
        .status.ok { color:#5a5; }
        .status.err { color:#c55; }
        .log { margin-top:8px;background:#161616;border:1px solid #2a2a2a;border-radius:4px;padding:10px;font-family:monospace;font-size:11px;color:#999;max-height:300px;overflow-y:auto;white-space:pre-wrap;word-break:break-all; }
    </style>
</head>
<body>
    <div class="title">拉片截图工具</div>
    <div class="row">
        <label for="mpc">每镜头标记数</label>
        <input type="number" id="mpc" value="3" min="1" max="20">
    </div>
    <div class="hint">I/O 入出点范围内自动均匀打标</div>
    <button class="btn1" id="btnPlace">1. 自动打标记</button>
    <button class="btn2" id="btnExport">2. 导出截图</button>
    <div class="divider"></div>
    <div class="status" id="status">就绪</div>
    <div class="log" id="log">日志将写入桌面 pr_log.txt\n</div>

    <script>
    (function() {
        var logEl = document.getElementById('log');
        var statusEl = document.getElementById('status');
        function log(msg, cls) { logEl.textContent += msg + '\n'; logEl.scrollTop = logEl.scrollHeight; if (cls) { statusEl.textContent = msg; statusEl.className = 'status ' + cls; } }
        function setStatus(msg, cls) { statusEl.textContent = msg; statusEl.className = 'status ' + (cls || ''); }
        function disableButtons(v) { document.getElementById('btnPlace').disabled = v; document.getElementById('btnExport').disabled = v; }
        var cs = new CSInterface();
        log('CEP 就绪');

        document.getElementById('btnPlace').addEventListener('click', function() {
            var mpc = parseInt(document.getElementById('mpc').value, 10) || 3;
            if (mpc < 1 || mpc > 20) return;
            disableButtons(true); setStatus('运行中...'); logEl.textContent = '';

            var jsx = '$.global.mpc = ' + mpc + ';'
                + '(function(){'
                + 'var LOG="C:/Users/54718/Desktop/pr_log.txt";'
                + 'var F=new File(LOG);F.open("w");'
                + 'function A(s){F.write(s+"\\n");$.writeln(s);}'
                + 'A("=== 自动打标记 ===");'
                + 'var seq=app.project.activeSequence;'
                + 'if(!seq){A("FAIL: 无序列");F.close();alert("FAIL: 无序列");return;}'
                + 'A("序列: "+seq.name);'
                + 'var mpc=$.global.mpc||3;A("标记/镜头: "+mpc);'

                + 'var ip=null,op=null;'
                + 'try{ip=seq.getInPointAsTime();A("getInPointAsTime: ticks="+ip.ticks+" sec="+ip.seconds);}'
                + 'catch(e){A("getInPointAsTime ERR: "+e);F.close();alert("ERR: getInPointAsTime");return;}'
                + 'try{op=seq.getOutPointAsTime();A("getOutPointAsTime: ticks="+op.ticks+" sec="+op.seconds);}'
                + 'catch(e){A("getOutPointAsTime ERR: "+e);F.close();alert("ERR: getOutPointAsTime");return;}'
                + 'if(!ip||!op){A("FAIL: ip/op null");F.close();alert("FAIL: IO null");return;}'
                + 'if(Number(ip.ticks)>=Number(op.ticks)){A("FAIL: IO invalid");F.close();alert("FAIL: IO范围无效");return;}'
                + 'A("I/O OK: "+ip.seconds.toFixed(1)+"s ~ "+op.seconds.toFixed(1)+"s");'

                + 'var clips=[];var vt=seq.videoTracks;A("轨数: "+vt.numTracks);'
                + 'for(var t=0;t<vt.numTracks;t++){var tk=vt[t];var cc=0;'
                + 'for(var c=0;c<tk.clips.numItems;c++){var cl=tk.clips[c];'
                + 'if(Number(cl.end.ticks)<=Number(ip.ticks)||Number(cl.start.ticks)>=Number(op.ticks))continue;'
                + 'var es=Math.max(Number(cl.start.ticks),Number(ip.ticks)),ee=Math.min(Number(cl.end.ticks),Number(op.ticks));'
                + 'if(ee-es<500)continue;clips.push({s:es,e:ee,d:ee-es});cc++;}'
                + 'A("轨"+t+": "+cc+" clips");}'
                + 'A("总clip: "+clips.length);'
                + 'if(!clips.length){A("FAIL: 无clip");F.close();alert("FAIL: 无clip");return;}'

                + 'clips.sort(function(a,b){return a.s-b.s;});'
                + 'var mk=seq.markers,tot=0;'
                + 'for(var i=0;i<clips.length;i++){var cl=clips[i];'
                + 'for(var j=1;j<=mpc;j++){var mt=(cl.s+Math.round(cl.d*j/(mpc+1)))/254016000000;'
                + 'var m=mk.createMarker(mt);if(m){m.name="C"+(i+1)+"-"+j;tot++;}}}'
                + 'A("=== 完成: "+tot+" markers ===");'
                + 'F.close();'
                + 'alert("完成!\\nclip:"+clips.length+"\\n标记:"+tot+"\\n\\n日志: 桌面 pr_log.txt");'
                + '})();';

            cs.evalScript(jsx, function(result) { disableButtons(false); setStatus('完成', 'ok'); });
        });

        document.getElementById('btnExport').addEventListener('click', function() {
            disableButtons(true); setStatus('导出中...'); logEl.textContent = '';

            var jsx = '(function(){'
                + 'var LOG="C:/Users/54718/Desktop/pr_log.txt";'
                + 'var F=new File(LOG);F.open("w");'
                + 'function A(s){F.write(s+"\\n");$.writeln(s);}'
                + 'A("=== 导出截图 ===");'
                + 'var seq=app.project.activeSequence;if(!seq){A("FAIL:no seq");F.close();alert("no seq");return;}'
                + 'A("序列:"+seq.name);'
                + 'var ip=null,op=null;try{ip=seq.getInPointAsTime();}catch(e){}try{op=seq.getOutPointAsTime();}catch(e){}'
                + 'if(ip&&op)A("I/O:"+ip.seconds.toFixed(1)+"s~"+op.seconds.toFixed(1)+"s");else A("无I/O");'
                + 'var mk=seq.markers;if(!mk||!mk.numMarkers){A("FAIL:无标记");F.close();alert("无标记");return;}'
                + 'A("标记数:"+mk.numMarkers);'
                + 'var dir=Folder.selectDialog("输出目录");if(!dir){A("取消");F.close();return;}'
                + 'A("输出:"+dir.fsName);'
                + 'app.enableQE();var qs=qe.project.getActiveSequence();if(!qs){A("FAIL:QE");F.close();alert("QE fail");return;}'
                + 'function S(n){return n.replace(/[\\\\/:*?"<>|]/g,"_");}'
                + 'var sn=S(seq.name),ex=0,sk=0,fa=0,idx=0,m=mk.getFirstMarker();'
                + 'while(m){idx++;'
                + 'if(ip&&op&&(Number(m.start.ticks)<Number(ip.ticks)||Number(m.start.ticks)>Number(op.ticks))){sk++;m=mk.getNextMarker(m);continue;}'
                + 'var mn=m.name?S(m.name):"M"+idx,fp=dir.fsName+"/"+sn+"_"+mn+".jpg";'
                + 'try{qs.setPlayerPosition(m.start.ticks);qs.exportFrameJPEG(qs.CTI.timecode,fp);ex++;}catch(e){fa++;}'
                + 'm=mk.getNextMarker(m);}'
                + 'A("=== 完成:导出"+ex+" 跳过"+sk+" 失败"+fa+" ===");'
                + 'F.close();'
                + 'alert("完成!\\n导出:"+ex+"\\n跳过:"+sk+"\\n失败:"+fa+"\\n\\n日志:桌面 pr_log.txt");'
                + '})();';

            cs.evalScript(jsx, function(result) { disableButtons(false); setStatus('完成', 'ok'); });
        });

        log('面板就绪。');
    })();
    </script>
</body>
</html>
