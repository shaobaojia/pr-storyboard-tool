<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>拉片截图工具</title>
    <script src="./lib/CSInterface.js"></script>
    <style>
        * { margin:0;padding:0;box-sizing:border-box; }
        body { font-family:-apple-system,"Segoe UI",sans-serif; background:#1e1e1e; color:#ccc; padding:16px; }
        .title { font-size:15px;font-weight:600;color:#fff;margin-bottom:16px;padding-bottom:10px;border-bottom:1px solid #333; }
        .row { display:flex;align-items:center;gap:10px;margin-bottom:14px; }
        .row label { font-size:13px;white-space:nowrap;color:#aaa; }
        .row input { width:48px;padding:6px 8px;background:#2d2d2d;border:1px solid #444;border-radius:4px;color:#fff;font-size:13px;text-align:center; }
        .hint { font-size:11px;color:#666;margin-top:-8px;margin-bottom:14px; }
        button { display:block;width:100%;padding:10px 14px;margin-bottom:8px;border:none;border-radius:5px;font-size:13px;font-weight:500;cursor:pointer; }
        button:active { opacity:.85; }
        .btn1 { background:#3a5fcd;color:#fff; }
        .btn1:hover { background:#4a6fdd; }
        .btn1:disabled { background:#2a3a5a;color:#666;cursor:not-allowed; }
        .btn2 { background:#3a7a3a;color:#fff; }
        .btn2:hover { background:#4a8a4a; }
        .btn2:disabled { background:#2a4a2a;color:#666;cursor:not-allowed; }
        .btn3 { background:#5a3a6a;color:#fff; }
        .btn3:hover { background:#6a4a7a; }
        .divider { height:1px;background:#333;margin:14px 0; }
        .status { font-size:12px;color:#888;min-height:20px;margin-bottom:4px; }
        .status.ok { color:#5a5; }
        .status.err { color:#c55; }
        .log { margin-top:8px;background:#161616;border:1px solid #2a2a2a;border-radius:4px;padding:10px;font-family:monospace;font-size:11px;color:#999;max-height:300px;overflow-y:auto;white-space:pre-wrap;word-break:break-all; }
    </style>
</head>
<body>
    <div class="title">拉片截图工具 <a href="javascript:history.go(0)" style="float:right;font-size:11px;color:#666;text-decoration:none;font-weight:normal;">↻ 刷新</a></div>
    <div class="row">
        <label for="mpc">每镜头标记数</label>
        <input type="number" id="mpc" value="1" min="1" max="20">
    </div>
    <div class="hint">I/O 入出点范围内自动均匀打标</div>
    <button class="btn1" id="btnPlace">自动打标记</button>
    <button class="btn3" id="btnRename">重命名标记</button>
    <div class="divider"></div>
    <div class="row">
        <label for="outDir">输出目录</label>
        <input type="text" id="outDir" value="D:\screenshots" style="width:auto;flex:1;">
    </div>
    <div class="hint">截图保存位置，如 D:\screenshots</div>
    <button class="btn2" id="btnExport">导出截图</button>
    <div class="divider"></div>
    <div class="status" id="status">就绪</div>
    <div class="log" id="log">日志和截图保存在插件目录下<br>就绪。</div>

    <script>
    (function() {
        var logEl = document.getElementById('log');
        var statusEl = document.getElementById('status');

        function log(msg, cls) {
            logEl.textContent += msg + '\n';
            logEl.scrollTop = logEl.scrollHeight;
            if (cls) { statusEl.textContent = msg; statusEl.className = 'status ' + cls; }
        }
        function setStatus(msg, cls) {
            statusEl.textContent = msg;
            statusEl.className = 'status ' + (cls || '');
        }
        function disableButtons(v) {
            document.getElementById('btnPlace').disabled = v;
            document.getElementById('btnExport').disabled = v;
        }

        var cs = new CSInterface();
        log('CEP 就绪，检测 host.jsx ...');

        // 诊断: 检查 $.hermes 是否被 ScriptPath 加载
        cs.evalScript('typeof $.hermes', function(r) {
            if (r === 'object') {
                log('✅ host.jsx 已加载', 'ok');
            } else {
                log('❌ host.jsx 未加载！typeof $.hermes = ' + r, 'err');
                log('请重启 Premiere Pro（manifest.xml 改了必须重启）', 'err');
            }
        });

        // === 自动打标记 ===
        document.getElementById('btnPlace').addEventListener('click', function() {
            var mpc = parseInt(document.getElementById('mpc').value, 10) || 3;
            if (mpc < 1 || mpc > 20) { setStatus('1~20', 'err'); return; }
            disableButtons(true);
            setStatus('打标中...');
            logEl.textContent = '';

            // ✅ 短调用 — host.jsx 已在面板启动时预加载
            cs.evalScript('$.hermes.autoPlace(' + mpc + ')', function(result) {
                disableButtons(false);
                if (result && String(result).indexOf('FAIL:') === 0) {
                    setStatus(result, 'err');
                } else {
                    setStatus('完成', 'ok');
                }
                log('→ ' + (result || '(无返回值)'));
            });
        });

        // === 重命名标记 ===
        document.getElementById('btnRename').addEventListener('click', function() {
            disableButtons(true);
            setStatus('重命名中...');
            logEl.textContent = '';
            cs.evalScript('$.hermes.renameMarkers()', function(result) {
                disableButtons(false);
                if (result && String(result).indexOf('FAIL:') === 0) {
                    setStatus(result, 'err');
                } else {
                    setStatus('完成', 'ok');
                }
                log('→ ' + (result || '(无返回值)'));
            });
        });

        // === 导出截图 ===
        document.getElementById('btnExport').addEventListener('click', function() {
            disableButtons(true);
            setStatus('导出中...');
            logEl.textContent = '';

            var outDir = document.getElementById('outDir').value.trim();
            if (!outDir) { setStatus('请填写输出目录', 'err'); disableButtons(false); return; }

            cs.evalScript('$.hermes.exportFrames("' + outDir.replace(/\\/g, '\\\\') + '")', function(result) {
                disableButtons(false);
                if (result && String(result).indexOf('FAIL:') === 0) {
                    setStatus(result, 'err');
                } else {
                    setStatus('完成', 'ok');
                }
                log('→ ' + (result || '(无返回值)'));
            });
        });
        // === 命令通道：NAS → CEP → PR ===
        // 面板每隔 2 秒检查命令文件，发现命令自动执行
        var cmdPolling = 0;
        setInterval(function() {
            cmdPolling++;
            cs.evalScript('$.hermes.checkCmd()', function(r) {
                if (r && r !== 'NOP') {
                    log('[cmd] ' + r, 'ok');
                }
            });
        }, 2000);
        log('命令通道已启动');
    })();
    </script>
</body>
</html>
